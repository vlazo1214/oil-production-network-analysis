services:
  api:
    build: ./server
    environment:
      DATA_DIR: /data
      WEIGHT: q            # q = quantity_tons, v = value_kUSD
      # PRODUCT: "crude oil"   # optional: keep only rows whose `product` equals this
    volumes:
      - ./data:/data       # put your cleaned CSV(s) here
    expose: ["8081"]
  web:
    build: ./web
    environment:
      API_URL: http://api:8081
    ports: ["3000:3000"]
    depends_on: [api]
